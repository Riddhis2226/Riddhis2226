<svg width="1600" height="400" viewBox="0 0 1600 400" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414">
        <animate attributeName="stop-color" values="#141414;#1c1712;#141414" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#221d19">
        <animate attributeName="stop-color" values="#221d19;#26201a;#221d19" dur="10s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E8A25C" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#E8A25C" stop-opacity="0"/>
    </radialGradient>

    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1600" height="400" fill="url(#bg)"/>

  <!-- breathing ambient glow behind the title -->
  <circle cx="380" cy="180" r="220" fill="url(#glow)" filter="url(#soft)">
    <animate attributeName="r" values="200;240;200" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;1;0.6" dur="6s" repeatCount="indefinite"/>
  </circle>

  <g stroke="#2b2825" stroke-width="1">
    <line x1="0" y1="100" x2="1600" y2="100"/>
    <line x1="0" y1="300" x2="1600" y2="300"/>
  </g>

  <!-- name -->
  <text x="90" y="188" font-family="Georgia, 'Times New Roman', serif" font-size="72" fill="#F4EFE9" letter-spacing="1">
    Riddhima Singh
  </text>
  <text x="93" y="234" font-family="'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#C6BEB4" letter-spacing="3">
    DATA ANALYST &amp; BI ENGINEER
  </text>

  <!-- drawing underline -->
  <line x1="93" y1="262" x2="93" y2="262" stroke="#E8A25C" stroke-width="4">
    <animate attributeName="x2" values="93;280;280;93;93" keyTimes="0;0.35;0.65;0.85;1" dur="5s" repeatCount="indefinite"/>
  </line>

  <text x="93" y="286" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#8a8378">
    Raipur, Chhattisgarh
  </text>

  <!-- domain constellation, drawing in and gently pulsing -->
  <g transform="translate(1300,200)">
    <circle r="6" fill="#F4EFE9"/>

    <g fill="none" stroke="#4a453e" stroke-width="1.5">
      <line x1="0" y1="0" x2="0" y2="-110" stroke-dasharray="110" stroke-dashoffset="110">
        <animate attributeName="stroke-dashoffset" values="110;0" dur="1.2s" begin="0.1s" fill="freeze"/>
      </line>
      <line x1="0" y1="0" x2="95" y2="-56" stroke-dasharray="110" stroke-dashoffset="110">
        <animate attributeName="stroke-dashoffset" values="110;0" dur="1.2s" begin="0.35s" fill="freeze"/>
      </line>
      <line x1="0" y1="0" x2="95" y2="56" stroke-dasharray="110" stroke-dashoffset="110">
        <animate attributeName="stroke-dashoffset" values="110;0" dur="1.2s" begin="0.6s" fill="freeze"/>
      </line>
      <line x1="0" y1="0" x2="0" y2="110" stroke-dasharray="110" stroke-dashoffset="110">
        <animate attributeName="stroke-dashoffset" values="110;0" dur="1.2s" begin="0.85s" fill="freeze"/>
      </line>
      <line x1="0" y1="0" x2="-100" y2="0" stroke-dasharray="100" stroke-dashoffset="100">
        <animate attributeName="stroke-dashoffset" values="100;0" dur="1.2s" begin="1.1s" fill="freeze"/>
      </line>
    </g>

    <g>
      <circle cx="0" cy="-110" r="10" fill="#E8A25C">
        <animate attributeName="r" values="9;12;9" dur="4s" begin="1.3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="95" cy="-56" r="10" fill="#C9714E">
        <animate attributeName="r" values="9;12;9" dur="4s" begin="1.7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="95" cy="56" r="10" fill="#5C7A73">
        <animate attributeName="r" values="9;12;9" dur="4s" begin="2.1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="110" r="10" fill="#8a8378">
        <animate attributeName="r" values="9;12;9" dur="4s" begin="2.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="-100" cy="0" r="10" fill="#3E8FA9">
        <animate attributeName="r" values="9;12;9" dur="4s" begin="2.9s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- traveling particle looping the perimeter -->
    <circle r="4" fill="#F4EFE9">
      <animateMotion dur="7s" repeatCount="indefinite"
        path="M0,0 L0,-110 L95,-56 L95,56 L0,110 L-100,0 Z"/>
    </circle>

    <g font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8a8378">
      <text x="0" y="-128" text-anchor="middle">Retail</text>
      <text x="126" y="-50" text-anchor="middle">Finance</text>
      <text x="126" y="78" text-anchor="middle">Health</text>
      <text x="0" y="142" text-anchor="middle">Logistics</text>
      <text x="-100" y="-20" text-anchor="middle">Education</text>
    </g>
  </g>
</svg>
